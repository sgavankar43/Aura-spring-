name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual one-click testing from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend Health & Neon
        run: |
          # Prefer secret; fall back to known production URL so cold-starts never sneak in
          # just because BACKEND_URL was unset.
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            URL="https://aura-spring.onrender.com"
            echo "BACKEND_URL secret unset — using production default: ${URL}"
          fi

          # Strip trailing slash and ensure protocol
          URL="${URL%/}"
          if [[ "$URL" != http* ]]; then
            URL="https://${URL}"
          fi

          echo "Pinging ${URL}/health to prevent cold-starts..."
          STATUS=$(curl -s -o /tmp/aura_health_body -w "%{http_code}" "${URL}/health" --max-time 45 || true)
          BODY=$(cat /tmp/aura_health_body 2>/dev/null || true)

          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Server and database are awake and healthy (HTTP 200). Body: ${BODY}"
          else
            echo "⚠️ Server responded with HTTP ${STATUS} (may be waking up from sleep). Body: ${BODY}"
            # Second attempt after Render cold-start wake
            sleep 8
            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health" --max-time 45 || true)
            echo "Retry HTTP ${STATUS2}"
          fi

